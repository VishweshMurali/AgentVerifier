[project]
name = "agent-committee"
version = "0.1.0"
description = "Decide whether an AI agent beats simpler alternatives under fair, pre-registered, paired conditions."
authors = [
    { name = "Vishwesh Murali", email = "vishweshmurali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.19",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
