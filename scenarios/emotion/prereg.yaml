# Pre-registration for scenario emotion: COPIED from Banking77's prereg (owner asked for the one-time
# split on 2026-11-12). Every cost, price and gap is Banking77's ASSUMPTION; review before any sealed run.
# MUST be committed BEFORE the sealed test set is unsealed (see CLAUDE.md).
# Every number marked `assumed: true` is an assumption to be reviewed by the owner, not a measurement.

task: emotion
metric: accuracy
alpha: 0.05
min_gap: 0.02            # ASSUMED: smallest accuracy difference (agent - best simpler) worth acting on
power: 0.80

split:
  seed: 20260101
  test_fraction: 0.25    # of the pooled dataset, stratified by label

stats:
  ci_level: 0.95
  bootstrap_replicates: 10000
  aa_simulations: 1000
  seed: 7

error_cost:              # USD cost of ONE wrong intent classification
  low: 0.50
  high: 20.00
  assumed: true

price_tables:            # USD per million tokens; hypothetical, three scenarios
  - name: local_amortized
    input_usd_per_mtok: 0.05
    output_usd_per_mtok: 0.10
    assumed: true
  - name: cloud_small
    input_usd_per_mtok: 0.25
    output_usd_per_mtok: 1.25
    assumed: true
  - name: cloud_large
    input_usd_per_mtok: 3.00
    output_usd_per_mtok: 15.00
    assumed: true

decision_policy:
  primary_comparison: agent_vs_best_simpler_on_dev   # best simpler arm is chosen on DEV only
  breakeven_requires_ci_above_zero: true             # report break-even only if diff CI is entirely > 0
  require_point_estimate_at_least_min_gap: true
  inconclusive_verdict: NEED_MORE_DATA
  latency_in_decision: false                         # latency is reported, never decided on

linear:                  # shared first step; must match arms/config
  null_threshold: 0.486288
  shortlist_k: 5

scorer:                  # plain code, no LLM
  name: exact_label
  target: agent_committee.scorers:exact_label

quality_floor:           # the agent works as an agent; accuracy is left to the comparison
  min_own_tool_rate: 0.90
  max_send_back_rate: 0.10

checks:                  # checks.py; a failed gating check binds the verdict, REPORT ones never do
  max_tune_drop: 0.04            # gating, NEED_MORE_DATA: held-out minus tune CI lower bound > -0.04
  null_rate_band: [0.07, 0.13]   # report: share of Null-flagged cases
  leak_jaccard: 0.90             # char 5-gram Jaccard that counts a test text as a copy of DEV
  max_leak_rate: 0.005           # report: copied share of test; copies are always dropped from the primary result (user decision 2026-11-03, set after DEV showed 0.61pct)
  min_test_n: 3028               # gating, NEED_MORE_DATA: test cases left after dropping copies (power.py, 15% discordance)
  max_score_ks: 0.10             # gating: KS D on the linear top score, held-out DEV (never the training pool) vs new data
  max_domain_auc: 0.60           # gating: AUC of a classifier telling DEV pool from new data
  drift_alpha: 0.01              # drift counts only when the effect is over its limit AND p < 0.01 (small samples)
  max_label_tv: 0.10             # report: label-mix total variation
  max_false_alarm_rate: 0.05     # gating, INVALID: drift checks firing on random DEV halves
  permutations: 10000            # per-label omnibus test
