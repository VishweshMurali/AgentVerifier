[project]
name = "agent-verifier-server"
version = "0.1.0"
description = "Local API for the Agent Verifier page: serves the story, live status and rehearsal jobs."
authors = [
    { name = "Vishwesh Murali", email = "vishweshmurali@gmail.com" }
]
requires-python = ">=3.12"
# A separate project, so the frozen pyproject.toml and uv.lock of the pipeline stay untouched.
dependencies = [
    "agent-committee",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
agent-committee = { path = "..", editable = true }

[tool.uv.build-backend]
module-name = "verifier_server"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agent_committee", "verifier_server"]
