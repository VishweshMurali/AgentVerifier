# Render blueprint: the public demo as a FREE static site (owner decision 2026-11-14).
#   Render dashboard > New > Blueprint > pick this repository and branch.
#
# What visitors get: the full scroll story on a saved, real quick test (labelled as an example).
# What they do not get: running their own test. A live test needs about 1.5 GB of memory at its
# peak (measured 2026-11-14: about 0.3 GB for the server plus 1.1 to 1.25 GB for the test
# process), and Render's free and 512 MB web services stop mid-test.
services:
  - type: web
    name: agent-verifier
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"

